<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>giorgi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07060a;
  --ink:#f3e9ee;
  --rose:#ff2d55;
  --rose-dim:#c2284a;
  --sys:#e0508a;
  --ok:#39e07a;
  --paper:#fbf4ee;
  --muted:#8d7f87;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:inherit;margin:0}
html{height:100%}

body{
  height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

canvas#heart{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease;
}

canvas#heart.dim{
  opacity:.16;
  filter:blur(2px);
  transform:scale(1.08);
}

/* INTRO */

#intro{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 8vw;
  gap:14px;
  transition:opacity .8s;
}

#intro.gone{
  opacity:0;
  pointer-events:none;
}

.ln{
  font-size:clamp(12px,3.4vw,15px);
  line-height:1.6;
  min-height:1.6em;
}

.sys{color:var(--sys)}
.ok{color:var(--ok);font-weight:700}
.ask{color:var(--muted);font-style:italic}

#btn{
  align-self:flex-start;
  margin-top:10px;
  background:rgba(255,45,85,.08);
  color:var(--rose);
  border:1px solid var(--rose-dim);
  padding:12px 18px;
  font:700 13px "JetBrains Mono",monospace;
  cursor:pointer;
  opacity:0;
  transition:opacity .6s,background .2s;
}

#btn.show{opacity:1}
#btn:hover{background:rgba(255,45,85,.2)}

.caret::after{
  content:"▌";
  color:var(--rose);
  animation:bl 1s steps(1) infinite;
  margin-left:2px;
}

@keyframes bl{50%{opacity:0}}

/* CURSORE */

#cur{
  position:absolute;
  left:0;
  top:0;
  width:26px;
  height:26px;
  z-index:20;
  pointer-events:none;
  opacity:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));
  will-change:transform;
}

#cur svg{
  width:100%;
  height:100%;
  transition:transform .12s;
}

#cur.press svg{transform:scale(.8)}

.rip{
  position:absolute;
  width:20px;
  height:20px;
  border:2px solid var(--rose);
  border-radius:50%;
  z-index:19;
  pointer-events:none;
  transform:translate(-50%,-50%);
  animation:rip .9s ease-out forwards;
}

@keyframes rip{
  to{width:240px;height:240px;opacity:0}
}

/* FOTO E LETTERA */

#stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5vw;
  padding:max(24px,env(safe-area-inset-top,0px)) 6vw 24px;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease .3s;
}

#stage.on{
  opacity:1;
  pointer-events:auto;
}

#photos{
  position:relative;
  flex:0 0 auto;
  width:min(38vw,380px);
  aspect-ratio:3/4;
}

.ph{
  position:absolute;
  inset:0;
  background:var(--paper);
  padding:10px 10px 44px;
  border-radius:3px;
  box-shadow:0 18px 50px rgba(255,45,85,.22),0 4px 14px rgba(0,0,0,.6);
  opacity:0;
  transform:rotate(var(--r,0deg)) scale(.94);
  transition:opacity 1.2s ease,transform 1.6s ease;
}

.ph.act{
  opacity:1;
  transform:rotate(var(--r,0deg)) scale(1);
}

.ph .im{
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  border-radius:2px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font:600 22px Caveat,cursive;
  text-align:center;
  padding:12px;
}

.ph .cap{
  position:absolute;
  left:0;
  right:0;
  bottom:10px;
  text-align:center;
  font:600 22px Caveat,cursive;
  color:#3a2a30;
}

#dots{
  position:absolute;
  left:0;
  right:0;
  bottom:-26px;
  display:flex;
  justify-content:center;
  gap:7px;
}

#dots i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#4a3a42;
  transition:background .4s,transform .4s;
}

#dots i.on{
  background:var(--rose);
  transform:scale(1.4);
}

#letter{
  flex:1 1 0;
  max-width:460px;
  max-height:calc(100% - 20px);
  overflow-y:auto;
  font:500 clamp(20px,2.5vw,27px)/1.5 Caveat,cursive;
  color:var(--ink);
  scrollbar-width:none;
  padding:6px 2px;
}

#letter::-webkit-scrollbar{display:none}

#letter .to{
  display:block;
  color:var(--rose);
  font-size:1.25em;
  margin-bottom:.3em;
}

#letter .w{
  opacity:0;
  display:inline-block;
  transform:translateY(5px);
  animation:wi .5s ease forwards;
}

@keyframes wi{to{opacity:1;transform:none}}

#replay{
  position:absolute;
  right:14px;
  top:calc(12px + env(safe-area-inset-top,0px));
  background:none;
  border:1px solid #3a2a32;
  color:var(--muted);
  font:400 11px "JetBrains Mono",monospace;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
  opacity:0;
  transition:opacity 1s;
}

#replay.show{opacity:1}

/* MOBILE */

@media(max-width:720px){
  #stage{
    flex-direction:column;
    gap:38px;
    justify-content:flex-start;
    padding-top:max(34px,env(safe-area-inset-top,0px));
  }

  #photos{width:min(62vw,280px)}

  #letter{
    width:100%;
    max-width:520px;
    font-size:clamp(19px,5.4vw,24px);
    text-align:left;
    flex:1 1 auto;
    min-height:0;
  }
}

@media(prefers-reduced-motion:reduce){
  .ph,#stage,canvas#heart{transition-duration:.01s}
}
</style>

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r,ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* INTRO */

async function typeInto(el,text,speed=28){

  el.classList.add('caret');
  el.innerHTML='';

  for(const c of text){
    el.append(document.createTextNode(c));
    await sleep(reduce ? 0 : speed + Math.random()*20);
  }

  el.classList.remove('caret');
}

/* CUORE */

const cv = $('#heart');
const ctx = cv.getContext('2d');

let W,H,DPR;
let items = [];
let startT = 0;
let fillDone = false;
let heartCx,heartCy,R,fs_;
let raf;

function insideHeart(x,y){

  const a=x*x+y*y-1;

  return a*a*a-x*x*y*y*y<=0;
}

function shuffle(a){

  const b=[...a];

  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }

  return b;
}

/* COSTRUZIONE DEL CUORE */

function buildHeart(){

  DPR=Math.min(devicePixelRatio||1,2);

  W=innerWidth;
  H=innerHeight;

  cv.width=W*DPR;
  cv.height=H*DPR;

  ctx.setTransform(DPR,0,0,DPR,0,0);

  R=Math.min(W*0.46,H*0.47);

  heartCx=W/2;
  heartCy=H/2;

  fs_=Math.max(8,Math.min(12,R/27));

  ctx.font=`700 ${fs_}px "JetBrains Mono", monospace`;

  const phrases=shuffle(CONFIG.lingue);

  let phraseIndex=0;

  items=[];

  const rowHeight=fs_*1.45;
  const step=0.0025;
  const gap=fs_*0.65;

  let rowIndex=0;

  for(let py=0.98;py>=-0.98;py-=rowHeight/R){

    let intervals=[];
    let start=null;

    for(let px=-1.15;px<=1.15;px+=step){

      const inside=insideHeart(px,py);

      if(inside && start===null){
        start=px;
      }

      if((!inside || px>=1.15) && start!==null){

        intervals.push({
          left:start*R,
          right:px*R
        });

        start=null;
      }
    }

    for(const interval of intervals){

      const width=interval.right-interval.left;

      if(width<fs_*2.5) continue;

      let row=[];
      let totalWidth=0;

      let attempts=0;

      while(attempts<phrases.length){

        const phrase=phrases[phraseIndex % phrases.length];

        const phraseWidth=ctx.measureText(phrase).width;

        const needed=phraseWidth+(row.length>0?gap:0);

        phraseIndex++;
        attempts++;

        if(totalWidth+needed<=width){

          row.push({
            text:phrase,
            width:phraseWidth
          });

          totalWidth+=needed;
          attempts=0;
        }
      }

      let x=heartCx+interval.left+(width-totalWidth)/2;

      row.forEach((word,colIndex)=>{

        items.push({

          x:x+word.width/2,
          y:heartCy-py*R,

          text:word.text,

          d:250+rowIndex*34+colIndex*8,

          phase:Math.random()*Math.PI*2,

          size:fs_*(0.95+Math.random()*0.08),

          center:false
        });

        x+=word.width+gap;
      });
    }

    rowIndex++;
  }

  let lastDelay=0;

  for(const item of items){
    if(item.d>lastDelay) lastDelay=item.d;
  }

  items.push({

    x:heartCx,
    y:heartCy,

    text:"TI AMO",

    d:lastDelay+450,

    phase:0,

    size:fs_*3.2,

    center:true
  });

}

function draw(t){

  raf=requestAnimationFrame(draw);

  const elapsed=t-startT;

  ctx.clearRect(0,0,W,H);

  const beat=
    1+
    0.018*Math.sin(elapsed/210)+
    0.008*Math.sin(elapsed/105);

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  let done=0;
  let maxDelay=0;

  for(const item of items){

    maxDelay=Math.max(maxDelay,item.d);

    const age=elapsed-item.d;

    if(age<0) continue;

    done++;

    const opacity=Math.min(1,age/650);

    const glow=
      0.75+0.25*Math.sin(elapsed/500+item.phase);

    const x=heartCx+(item.x-heartCx)*beat;
    const y=heartCy+(item.y-heartCy)*beat;

    ctx.save();

    ctx.globalAlpha=opacity*(item.center?1:glow);

    if(item.center){

      ctx.fillStyle='#ffffff';
      ctx.shadowColor='rgba(255,45,100,1)';
      ctx.shadowBlur=28;

      ctx.font=`700 ${item.size}px "JetBrains Mono", monospace`;

    }else{

      ctx.fillStyle='#ff315d';
      ctx.shadowColor='rgba(255,35,85,0.85)';
      ctx.shadowBlur=7;

      ctx.font=`700 ${item.size}px "JetBrains Mono", monospace`;
    }

    ctx.fillText(item.text,x,y);

    ctx.restore();
  }

  if(
    !fillDone &&
    items.length>0 &&
    done===items.length &&
    elapsed>maxDelay+800
  ){

    fillDone=true;
    onFilled();
  }
}

function startHeart(){

  buildHeart();

  fillDone=false;
  startT=performance.now();

  cancelAnimationFrame(raf);

  raf=requestAnimationFrame(draw);
}

addEventListener('resize',()=>{

  if(state==='heart'||state==='cursor'){

    buildHeart();

    startT=performance.now()-30000;
  }
});

/* CURSORE ANIMATO */

const cur=$('#cur');

function moveCursor(x0,y0,x1,y1,dur){

  return new Promise(res=>{

    const cx=(x0+x1)/2+(y1-y0)*0.25;
    const cy=(y0+y1)/2-(x1-x0)*0.2;

    const t0=performance.now();

    (function f(now){

      let p=Math.min(1,(now-t0)/dur);

      const e=p<0.5
        ? 2*p*p
        : 1-Math.pow(-2*p+2,2)/2;

      const x=
        (1-e)*(1-e)*x0+
        2*(1-e)*e*cx+
        e*e*x1;

      const y=
        (1-e)*(1-e)*y0+
        2*(1-e)*e*cy+
        e*e*y1;

      cur.style.transform=`translate(${x}px,${y}px)`;

      p<1?requestAnimationFrame(f):res();

    })(performance.now());
  });
}

async function onFilled(){

  if(state!=='heart') return;

  state='cursor';

  await sleep(500);

  const sx=W*0.85;
  const sy=H*0.88;

  cur.style.transform=`translate(${sx}px,${sy}px)`;
  cur.style.opacity=1;

  await moveCursor(
    sx,
    sy,
    heartCx-4,
    heartCy-R*0.1,
    reduce?10:1900
  );

  await sleep(450);

  clickHeart();
}

async function clickHeart(){

  if(state!=='cursor') return;

  state='reveal';

  cur.classList.add('press');

  const r=document.createElement('div');

  r.className='rip';
  r.style.left=heartCx+'px';
  r.style.top=(heartCy-R*0.1)+'px';

  $('#app').append(r);

  await sleep(160);

  cur.classList.remove('press');

  cv.classList.add('dim');

  await sleep(600);

  cur.style.opacity=0;

  showStage();
}

cv.addEventListener('click',()=>{
  if(state==='heart') onFilled();
});

cv.addEventListener('touchend',()=>{
  if(state==='heart') onFilled();
},{passive:true});

/* FOTO */

let userPhotos=[];
let slideIdx=0;
let slideTimer;

const PLACE=[
  'linear-gradient(135deg,#ff2d55,#8a1c47)',
  'linear-gradient(135deg,#ff8a5c,#c2284a)',
  'linear-gradient(135deg,#a64dff,#ff2d55)',
  'linear-gradient(135deg,#ff5c9a,#5b1a4a)'
];

function buildPhotos(){

  const box=$('#photos');

  box.querySelectorAll('.ph').forEach(n=>n.remove());

  const src=[...CONFIG.foto,...userPhotos];

  const n=src.length||PLACE.length;

  const dots=$('#dots');
  dots.innerHTML='';

  for(let i=0;i<n;i++){

    const d=document.createElement('div');

    d.className='ph';

    d.style.setProperty(
      '--r',
      ((i%2?1:-1)*(1+Math.random()*2.2)).toFixed(1)+'deg'
    );

    const im=document.createElement('div');

    im.className='im';

    if(src.length){
      im.style.backgroundImage=`url("${src[i]}")`;
    }else{
      im.style.background=PLACE[i%PLACE.length];
      im.textContent='La vostra foto qui ♥';
    }

    d.append(im);

    const cap=CONFIG.didascalie[i];

    if(cap){

      const c=document.createElement('div');

      c.className='cap';
      c.textContent=cap;

      d.append(c);
    }

    box.insertBefore(d,dots);

    const dot=document.createElement('i');

    dots.append(dot);
  }

  slideIdx=0;
  show(0);

  clearInterval(slideTimer);

  if(n>1){
    slideTimer=setInterval(
      ()=>show((slideIdx+1)%n),
      3800
    );
  }
}

function show(i){

  slideIdx=i;

  document.querySelectorAll('.ph').forEach((p,k)=>{
    p.classList.toggle('act',k===i);
  });

  document.querySelectorAll('#dots i').forEach((p,k)=>{
    p.classList.toggle('on',k===i);
  });
}

/* LETTERA */

let letterRun=0;

async function writeLetter(){

  const id=++letterRun;
  const box=$('#letter');

  box.innerHTML='';

  const to=document.createElement('span');

  to.className='to';
  to.textContent=`per te, ${CONFIG.nome},`;

  box.append(to);

  const paras=CONFIG.lettera.split(/\n\s*\n/);

  await sleep(1200);

  for(let p=0;p<paras.length;p++){

    const para=document.createElement('p');

    para.style.marginBottom='.7em';

    if(p===paras.length-1){
      para.style.color='var(--rose)';
    }

    box.append(para);

    for(const w of paras[p].trim().split(/\s+/)){

      if(id!==letterRun) return;

      const s=document.createElement('span');

      s.className='w';
      s.textContent=w+'\u00A0';

      para.append(s);

      box.scrollTop=box.scrollHeight;

      let wait=CONFIG.velocitaParola;

      if(/[.!?]$/.test(w)){
        wait+=450;
      }else if(/[,;:]$/.test(w)){
        wait+=200;
      }

      await sleep(reduce?20:wait);
    }

    await sleep(500);
  }

  $('#replay').classList.add('show');
}

function showStage(){

  state='stage';

  buildPhotos();

  $('#stage').classList.add('on');

  writeLetter();
}

/* CONTROLLI */

$('#btn').addEventListener('click',()=>{

  state='heart';

  $('#intro').classList.add('gone');

  startHeart();
});

$('#replay').addEventListener('click',()=>{

  letterRun++;

  clearInterval(slideTimer);

  $('#stage').classList.remove('on');
  $('#replay').classList.remove('show');

  cv.classList.remove('dim');

  state='heart';

  startHeart();
});

intro();

</script>
